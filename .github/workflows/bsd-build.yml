
name: BSD build

on:
  push:
    branches: [freebsd-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD 15.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          sync: nfs

      - name: Install dependencies
        shell: freebsd {0}
        run: |
          set -eux
          pkg install -y bash cmake ninja git

      - name: Show environment
        shell: freebsd {0}
        run: |
          set -eux
          freebsd-version
          command -v bash
          cmake --version
          ninja --version
          pwd

      - name: Configure CMake
        shell: freebsd {0}
        run: |
          set -eux
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: freebsd {0}
        run: |
          set -eux
          cmake --build build --parallel 4 --verbose

  openbsd:
    name: OpenBSD 7.9
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          sync: nfs

      - name: Install dependencies
        shell: openbsd {0}
        run: |
          set -eux
          pkg_add bash cmake ninja git

      - name: Show environment
        shell: openbsd {0}
        run: |
          set -eux
          uname -a
          command -v bash
          cmake --version
          ninja --version
          pwd

      - name: Configure CMake
        shell: openbsd {0}
        run: |
          set -eux
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: openbsd {0}
        run: |
          set -eux
          cmake --build build --parallel 4 --verbose

  dragonflybsd:
    name: DragonFly BSD 6.4.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Start DragonFly BSD VM
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: "6.4.2"
          sync: nfs

      - name: Install dependencies
        shell: dragonflybsd {0}
        run: |
          set -eux
          pkg install -y bash cmake ninja git

      - name: Show environment
        shell: dragonflybsd {0}
        run: |
          set -eux
          uname -a
          command -v bash
          cmake --version
          ninja --version
          pwd

      - name: Configure CMake
        shell: dragonflybsd {0}
        run: |
          set -eux
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: dragonflybsd {0}
        run: |
          set -eux
          cmake --build build --parallel 4 --verbose
